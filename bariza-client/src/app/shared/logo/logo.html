@if (variant === 'icon') {
  <svg class="logo-icon" viewBox="0 0 120 120" aria-hidden="true">
    <rect width="120" height="120" rx="28" fill="var(--color-primary, #0B6E4F)" />
    <path d="M24 52c0-12 10-22 22-22h28c12 0 22 10 22 22v8H24z" fill="var(--color-accent, #F5A524)" />
    <rect x="28" y="58" width="64" height="34" rx="8" fill="var(--color-bg, #FAF7F2)" />
    <rect x="36" y="66" width="12" height="18" rx="3" fill="var(--color-primary, #0B6E4F)" />
    <rect x="54" y="66" width="12" height="18" rx="3" fill="var(--color-primary, #0B6E4F)" />
    <rect x="72" y="66" width="12" height="18" rx="3" fill="var(--color-primary, #0B6E4F)" />
  </svg>
} @else {
  <span class="logo-full" [class.logo-dark]="theme === 'dark'">
    <svg class="logo-icon" viewBox="0 0 120 120" aria-hidden="true">
      <rect width="120" height="120" rx="28" fill="var(--color-primary, #0B6E4F)" />
      <path d="M24 52c0-12 10-22 22-22h28c12 0 22 10 22 22v8H24z" fill="var(--color-accent, #F5A524)" />
      <rect x="28" y="58" width="64" height="34" rx="8" fill="var(--color-bg, #FAF7F2)" />
      <rect x="36" y="66" width="12" height="18" rx="3" fill="var(--color-primary, #0B6E4F)" />
      <rect x="54" y="66" width="12" height="18" rx="3" fill="var(--color-primary, #0B6E4F)" />
      <rect x="72" y="66" width="12" height="18" rx="3" fill="var(--color-primary, #0B6E4F)" />
    </svg>
    <span class="logo-text">
      <strong>{{ 'brand.name' | translate }}</strong>
    </span>
  </span>
}
