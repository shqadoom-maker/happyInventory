<div class="seller-products-page">
  <h1>Seller products</h1>
  <a class="btn" routerLink="/shop/seller/products/new">Add product</a>

  @if (loading) {
    <p>Loading…</p>
  } @else if (products.length === 0) {
    <p>No products yet.</p>
  } @else {
    @for (product of products; track product.id) {
      <article class="product-row">
        <span>{{ product.name }}</span>
        <span>{{ product.price }}</span>
        <span>{{ product.isPublished ? 'Published' : 'Draft' }}</span>
        <button type="button" (click)="edit(product)">Edit</button>
        <button type="button" (click)="remove(product)">Delete</button>
      </article>
    }
  }
</div>
